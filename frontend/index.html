<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DR1P — Y2K Streetwear</title>
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="./y2k.css">
</head>
<body class="js-motion">
  <!-- Header / Nav -->
  <header class="nav">
    <div class="nav-inner">
      <a href="./" class="logo-link"><img src="./logo.png" alt="DR1P" class="header-logo"></a>
      <nav class="nav-links">
        <a href="#inicio" class="active">INICIO</a>
        <a href="#remeras">REMERAS</a>
        <a href="#pantalones">PANTALONES</a>
        <a href="#gorras">GORRAS</a>
        <a href="#drop">DROP</a>
        <a href="#contacto">CONTACTO</a>
      </nav>
      <div class="nav-tools">
        <input type="text" id="nav-search" placeholder="BUSCAR...">
        <button class="cart-btn" onclick="toggleCart()">🛒 <span id="count">0</span></button>
      </div>
    </div>
  </header>

  <!-- Hero con Espinas y Título Y2K -->
  <section id="inicio" class="y2k-hero">
    <div class="y2k-grain"></div>
    <div class="thorns">
      <div class="thorn corner tl" data-depth="14"><div class="float"><img src="./thorn.png" alt=""><div class="glint"></div></div></div>
      <div class="thorn corner tr" data-depth="14"><div class="float"><img src="./thorn.png" alt=""><div class="glint"></div></div></div>
      <div class="thorn corner bl" data-depth="14"><div class="float"><img src="./thorn.png" alt=""><div class="glint"></div></div></div>
      <div class="thorn corner br" data-depth="14"><div class="float"><img src="./thorn.png" alt=""><div class="glint"></div></div></div>
      <div class="thorn band top" data-depth="8"><div class="float"><img src="./barbed-band.png" alt=""><div class="glint"></div></div></div>
      <div class="thorn band bottom" data-depth="8"><div class="float"><img src="./barbed-band.png" alt=""><div class="glint"></div></div></div>
    </div>
    <div class="hero-content" data-reveal>
      <p class="kicker"><b>SS 26</b> // STOCK LIMITADO // PRENDAS EXCLUSIVAS</p>
      <h1 class="y2k-title">
        <span class="line">LLENATE</span>
        <span class="line">DE DR1P.</span>
      </h1>
      <p class="y2k-sub">Streetwear underground. Drops cortos, sin reposición.</p>
      <div class="y2k-ctas">
        <a href="#catalogo" class="btn-chrome"><span>VER CATÁLOGO</span></a>
        <a href="#probarte" class="btn-ghost"><span>GIRÁ LA RULETA -</span></a>
      </div>
    </div>
  </section>

  <!-- Catálogo y Secciones -->
  <section id="catalogo" class="section zone-mid">
    <h2 id="titulo-categoria">[ CATÁLOGO // TODOS ]</h2>
    <div class="filters">
      <button class="active" onclick="filtrar('todos')">TODOS</button>
      <button onclick="filtrar('remeras')">REMERAS</button>
      <button onclick="filtrar('pantalones')">PANTALONES</button>
      <button onclick="filtrar('gorras')">GORRAS</button>
    </div>
    <div id="productos" class="grid"></div>
  </section>

  <!-- Carrito Drawer -->
  <div id="cart-drawer" class="drawer">
    <button onclick="toggleCart()">✕</button>
    <h2>CARRITO</h2>
    <div id="carrito"></div>
    <div id="descuento-line" style="display:none">Descuento: $<span id="descuento">0</span></div>
    <div>Total: $<span id="total-final">0</span></div>
    <input type="text" id="cupon" placeholder="Cupón de descuento">
    <button onclick="aplicarCupon()">Aplicar Cupón</button>
    <input type="text" id="nombre" placeholder="Tu nombre">
    <button onclick="enviarWhatsApp()">Comprar por WhatsApp</button>
  </div>
  <div id="overlay" onclick="toggleCart()"></div>

  <!-- Scripts -->
  <script src="./app.js"></script>
  <script type="module" src="./y2k.js"></script>
</body>
</html>
